[project]
name = "rag-oposiciones"
version = "0.1.0"
description = "RAG system for public exam preparation"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # Pydantic & settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # RAG / LLM
    "llama-index>=0.12.0",
    "llama-index-readers-file>=0.4.0",
    "llama-index-vector-stores-qdrant>=0.4.0",
    "llama-index-embeddings-openai>=0.3.0",
    "litellm>=1.40",
    # Vector store
    "qdrant-client>=1.12.0,<1.15.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Storage
    "minio>=7.2.0",
    # Observability
    "structlog>=24.4.0",
    "langfuse>=2.56.0",
    # Document parsers
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    # HTTP
    "httpx>=0.28.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Frontend
    "streamlit>=1.40.0",
    "pytest>=9.0.2",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.0",
]
evals = [
    "ragas>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations (type hints)
    "S",   # flake8-bandit (security)
    "PTH", # use pathlib over os.path
]
ignore = ["ANN101", "ANN102", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S"]
"src/frontend/pages/*" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["src/frontend/*"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.5",
]
